<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Hearts</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
  min-height:100vh;
  background:#ffffff;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  gap:40px;
  position:relative;
}

/* 爱心跳动动画 */
@keyframes beat{
  0%{transform:scale(1);}
  50%{transform:scale(1.15);}
  100%{transform:scale(1);}
}
@keyframes colorRun{
  0%{filter:hue-rotate(0deg);}
  100%{filter:hue-rotate(360deg);}
}

.heart{
  position:relative;
  width:220px;
  height:200px;
  animation: beat 1.2s infinite ease-in-out, colorRun 5s infinite linear;
  cursor:pointer;
}
.heart::before,.heart::after{
  content:"";
  position:absolute;
  top:0;
  width:110px;
  height:170px;
  background:#ff2e63;
  border-radius:55px 55px 0 0;
}
.heart::before{
  left:110px;
  transform:rotate(-45deg);
  transform-origin:0 100%;
}
.heart::after{
  left:0;
  transform:rotate(45deg);
  transform-origin:100% 100%;
}
.heart-text{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  color:#fff;
  font-size:24px;
  z-index:10;
}

/* 按钮样式 */
#btn{
  padding:12px 36px;
  font-size:18px;
  background:#ff4477;
  color:white;
  border:none;
  border-radius:30px;
  cursor:pointer;
}
#btn:hover{
  background:#ff2255;
}
#jumpBtn {
  padding: 8px 16px;
  font-size: 28px;
  color: #ff88aa;
  background: transparent;
  border: none;
  outline: none;
  cursor: pointer;
}
#jumpBtn:hover {
  color: #ff4477;
}
/* 向上飘文字动画 */
@keyframes floatUp{
  0%{opacity:1;transform:translateY(0);}
  100%{opacity:0;transform:translateY(-120px);}
}
.float-text{
  position:absolute;
  font-size:32px;
  color:#ff88aa;
  pointer-events:none;
}
</style>
</head>
<body>
<div class="heart" id="heart">
  <div class="heart-text">️</div>
</div>

<!-- 跳转按钮 -->
<button id="jumpBtn">Surprise</button>

<script>
const heart = document.getElementById('heart');
const jumpBtn = document.getElementById('jumpBtn');

// 点击爱心弹出上浮文字
function showText(){
  const div = document.createElement('div');
  div.className = 'float-text';
  div.innerText = "替我上班！！！";
  div.style.left = heart.offsetLeft + heart.offsetWidth/2 - 60 + 'px';
  div.style.top = heart.offsetTop + 30 + 'px';
  div.style.animation = 'floatUp 1.5s ease-out forwards';
  document.body.appendChild(div);
  setTimeout(()=>{
    div.remove();
  },1500)
}

heart.addEventListener('click',showText);

// ========== 点击按钮跳转页面 ==========
jumpBtn.addEventListener('click',function(){
  // 方式1：当前窗口跳转
   window.location.href = "replace.html";

  // 方式2：新标签页打开（推荐）
  //window.open("page2.html","_blank");
})
</script>
</body>
</html>
