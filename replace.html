<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<title>TWSB</title>
	</head>
	<style>
		@keyframes colorChange{
			0% {color: red;}
			11%{color: orange;}
			22%{color: yellow;}
			44%{color: green;}
			66%{color: blue;}
			88%{color: purple;}
			100%{color: red;}
		}
		h1{
			height: 150px;
			display: flex;
			align-items: center;
			justify-content: center;
			font-size: 100px;
			animation: colorChange 1s infinite linear;
		}
	</style>
	<body>
		<h1 >替我上班！！！</h1>
		<h1 >替我上班！！！</h1>
		<h1 >替我上班！！！</h1>
	</body>
</html>
